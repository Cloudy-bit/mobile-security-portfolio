[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "android-network-tls-security-analyzer"
version = "1.0.0"
description = "Static Android network security configuration analyzer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
android-network-tls-analyzer = "network_tls_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["network_tls_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
